; Pico2Atari8 - Atari 8-bit computer emulation (atari800) for iCode devices.
;
; [env:quad]  Quad Ultimate CX / CX-W (GameAdapterRGBPico MODEL_QUAD, RP2350B, 4 MB).
;             Chain-booted by the Quad firmware like Pico2Arcade: the image
;             is linked at 0x10000000 and the boot ROM's rom_chain_image maps
;             its flash slot there, with the Quad's FAT12 "ARCADE ROMS" drive
;             further on in the window (src/pico_romfs.cpp). From Quad 1.1 it
;             has its own Atari 8-bit slot (0x210000, 384 KB), started by
;             Mini-Games > Atari 8-bit; window 0x210000..0x3FFFFF, the 512 KB
;             ROM drive (0x380000) at window offset 0x170000. Unzip area
;             0x1F0000, settings 0x2D0000: below CX-W's 512 KB LittleFS
;             (docs/FLASH_LAYOUT.md).
;             `pio run -e quad -t upload` writes only that slot (a8_upload.py).

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2xl
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 200000000L
upload_protocol = picotool
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
lib_ldf_mode = chain+

build_flags =
    -O2
    ; TFT_eSPI: the GMT024 ST7789 panel used by the iCode devices
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DTFT_SPI_MODE=SPI_MODE0
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=8
    -DTFT_RST=9
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=100000000
    -DSPI_PORT=0
    -Isrc
    -Ilib/atari800/src
    -Isrc/uzlib
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-sign-compare
    ; the core's fopen/fclose read from the ROM drive (src/a8_files.cpp)
    -Wl,--wrap=fopen
    ; cartridges are read in place from the ROM drive (src/a8_files.cpp)
    -DA8_MAPPED_CARTS
    -Wl,--wrap=fclose
    ; the core's printf/puts and exit() show on the serial monitor (src/a8_debug.cpp)
    -Wl,--wrap=printf
    -Wl,--wrap=puts
    -Wl,--wrap=exit
    -Wl,--wrap=perror

extra_scripts = pre:tft_overlay.py

[env:quad]
build_flags =
    ${env.build_flags}
    -DPICO_QUAD
    ; ST7789 backlight MOSFET - TFT_eSPI switches it on in init()
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH
    -DHANDOFF_RELAUNCH_MAGIC=0xA7A8B001u
    ; Fallbacks if the Quad didn't pass the ROM drive location (scratch[0]/[2]/[3])
    -DPICO_HOST_FAT_WINDOW_OFS=0x170000
    -DPICO_HOST_FAT_PHYS=0x380000
    -DPICO_HOST_FAT_SIZE=0x80000
    ; zipped games are unpacked here (src/a8_zip.cpp): 128 KB the Quad 1.1
    ; firmware reserves (build_release.py FIRMWARE_LIMITS 0x1F0000)
    -DA8_UNZIP_PHYS=0x1F0000
    -DA8_UNZIP_SIZE=0x20000
    -DA8_SETTINGS_PHYS=0x2D0000
    ; USB ROM drive mode (src/pico_drive.cpp) needs the TinyUSB stack
    -DUSE_TINYUSB
extra_scripts =
    pre:tft_overlay.py
    post:a8_upload.py
custom_slot_offset = 0x10210000

; [env:duo5200]  Duo 5200 Ultimate (GameAdapterRGBPico MODEL_5200, from 1.2):
;             its own Atari 8-bit slot at 0x2A0000 (384 KB), chain-booted by
;             Mini-Games > Atari 8-bit, with HANDOFF_ATARI8_MAGIC to come back
;             to it. It shares the arcade's 512 KB "ARCADE ROMS" drive
;             (0x360000; window offset 0xC0000 - the window runs over the
;             arcade slot to it). Unzip area 0x280000, settings 0x3E0000
;             (docs/FLASH_LAYOUT.md). Input: two Atari 5200 controllers
;             (src/a8_input.cpp). GameAdapterRGBPico's build_release.py
;             bundles this image into the Duo 5200 release.
[env:duo5200]
build_flags =
    ${env.build_flags}
    -DPICO_5200
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH
    -DHANDOFF_RELAUNCH_MAGIC=0xA7A8B001u
    ; Fallbacks if the host didn't pass the ROM drive location (scratch[0]/[2]/[3])
    -DPICO_HOST_FAT_WINDOW_OFS=0xC0000
    -DPICO_HOST_FAT_PHYS=0x360000
    -DPICO_HOST_FAT_SIZE=0x80000
    -DA8_UNZIP_PHYS=0x280000
    -DA8_UNZIP_SIZE=0x20000
    -DA8_SETTINGS_PHYS=0x3E0000
    -DUSE_TINYUSB
extra_scripts =
    pre:tft_overlay.py
    post:a8_upload.py
custom_slot_offset = 0x102A0000

; [env:duo]  Duo Ultimate (GameAdapterRGBPico MODEL_DUO, from 2.3, 16 MB):
;             its Atari 8-bit slot at 0x820000 (384 KB), chain-booted by the
;             Duo's start-up / Mini-Games menu (Atari Games), with
;             HANDOFF_ATARI8_MAGIC to come back to it. It shares the arcade's
;             1 MB "ARCADE ROMS" drive (0x900000; window offset 0xE0000 - the
;             window runs over the arcade slot at 0x880000 to it). Unzip area
;             0x800000, settings 0x8E0000. Same 160x80 panel, Duo pins and DB9
;             port power as duo_tiny, but hosted (volume, return to the Duo).
;             GameAdapterRGBPico's build_release.py bundles this image into
;             the Duo release.
[env:duo]
build_unflags =
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=8
    -DTFT_RST=9
build_flags =
    ${env.build_flags}
    -DPICO_DUO
    -DPICO_TINY_SCREEN
    ; ST7735S 160x80 panel - same flags as GameAdapterRGBPico [env:duo]
    -DST7735_DRIVER=1
    -DST7735_REDTAB160x80=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MOSI=3
    -DTFT_SCLK=2
    -DTFT_CS=14
    -DTFT_DC=15
    -DTFT_RST=4
    -DHANDOFF_RELAUNCH_MAGIC=0xA7A8B001u
    ; Fallbacks if the host didn't pass the ROM drive location (scratch[0]/[2]/[3])
    -DPICO_HOST_FAT_WINDOW_OFS=0xE0000
    -DPICO_HOST_FAT_PHYS=0x900000
    -DPICO_HOST_FAT_SIZE=0x100000
    -DA8_UNZIP_PHYS=0x800000
    -DA8_UNZIP_SIZE=0x20000
    -DA8_SETTINGS_PHYS=0x8E0000
    -DUSE_TINYUSB
extra_scripts =
    pre:tft_overlay.py
    post:a8_upload.py
custom_slot_offset = 0x10820000

; [env:duo_tiny]  Duo Ultimate (GameAdapterRGBPico data/duoultimate.json), its
;             160x80 ST7735 panel - a TEST build, standalone: flashes at
;             offset 0 and REPLACES the Duo firmware (reflash the Duo UF2
;             afterwards), as Pico2Arcade's duo_tiny. The picture is shrunk to
;             160x80 (src/a8_scale.c; MENU tap = next Scale mode). Flash: the
;             firmware from 0, unzip area 0x1C0000 (128 KB), the 1 MB "ARCADE
;             ROMS" drive at 0x200000 (Pico2Arcade's standalone drive: the
;             two test builds share it), settings 0x302000 (after the arcade's
;             settings and high scores). Input: the two DB9 ports, the 5-way
;             and the device buttons (src/a8_input.cpp).
[env:duo_tiny]
build_unflags =
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=8
    -DTFT_RST=9
build_flags =
    ${env.build_flags}
    -DPICO_STANDALONE
    -DPICO_DUO
    -DPICO_TINY_SCREEN
    ; ST7735S 160x80 panel - same flags as GameAdapterRGBPico [env:duo]
    -DST7735_DRIVER=1
    -DST7735_REDTAB160x80=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MOSI=3
    -DTFT_SCLK=2
    -DTFT_CS=14
    -DTFT_DC=15
    -DTFT_RST=4
    -DA8_UNZIP_PHYS=0x1C0000
    -DA8_UNZIP_SIZE=0x20000
    -DA8_SETTINGS_PHYS=0x302000
    -DUSE_TINYUSB

; [env:fruitjam]  Adafruit Fruit Jam (RP2350B, 16 MB flash, 8 MB PSRAM) - a
;             TEST build for the next hardware revision, standalone (flashes
;             at 0). Picture: HDMI 800x480 @ 60 Hz from the RP2350's HSTX
;             (A8_HDMI, src/a8_display.cpp, with Pimoroni's dvhstx driver from
;             Adafruit-DVI-HSTX compiled at its end): each line is made as it
;             goes out, no frame buffer; the menus draw into a 320x240 8-bit
;             canvas. TFT_eSPI is never started, so the TFT pins in [env]
;             (5 = button 3, 8 / 9 = the ESP32's UART) are never touched.
;             Sound: POKEY over I2S to the board's TLV320DAC3100
;             (src/pico_audio.cpp; codec driver: PicoMultiTrackAudio's
;             PicoTlv320 only, not its mixer).
;             Buttons: game list 1 down, 3 tap up, 2 OK, 3 held back; in a
;             game 1 fire, 2 START, 3 tap keyboard / held the game list. The
;             serial monitor is a controller too (src/a8_input.cpp: arrows /
;             wasd, space, Enter, Esc, Tab, o, k) and has the sound's keys
;             (+ - volume, A H S B output, I report).
;             Games: USB ROM drive mode (button 2 held at power-on; button 1
;             is BOOT), or the list's ROM Drive row. Flash as duo_tiny: unzip
;             area 0x1C0000, the 1 MB drive at 0x200000, settings 0x302000.
;             A8_HEADLESS instead of A8_HDMI: no picture, a game started by
;             itself (A8_AUTOSTART or the first), button 3 = the next game.
[env:fruitjam]
board = adafruit_fruitjam
; 150 MHz = the core leaves clk_sys alone in main(): the HDMI driver's
; start-up has already moved it to PLL_USB / 2 = 240 MHz (and runs HSTX from
; PLL_SYS at the exact pixel clock). Any other value would put clk_sys back
; on PLL_SYS, which the driver then re-tunes for HSTX.
board_build.f_cpu = 150000000L
; Both libraries are fetched for a part only and not built as libraries:
; USE_TINYUSB makes the core build with lib_archive = no, so each of their
; objects would be linked whole (PicoMultiTrackAudio's file player's global
; File handles kept its code and all of LittleFS; Adafruit-DVI-HSTX's
; wrapper needs Adafruit GFX). PicoMultiTrackAudio: the codec driver
; (header-only, PicoTlv320*.hpp); Adafruit-DVI-HSTX: Pimoroni's dvhstx
; driver, compiled at the end of src/a8_display.cpp.
; Pico-PIO-USB 0.7.2 (the USB host ports, A8_USB_HOST) is a copy in
; extern/pico-pio-usb: fetched as a library it pulls in a second Adafruit
; TinyUSB, which the build then takes over the core's own. Compiled in
; src/a8_stubs.c; TinyUSB's host stack takes it up when pio_usb.h is on the
; include path.
lib_deps =
    ${env.lib_deps}
    https://github.com/alijani1/PicoMultiTrackAudio.git#v2.1.0
    dvhstx=https://github.com/adafruit/Adafruit-DVI-HSTX.git#2.1.0
lib_ignore =
    PicoMultiTrackAudio
    Adafruit DVI HSTX
    dvhstx
build_flags =
    ${env.build_flags}
    -I.pio/libdeps/fruitjam/PicoMultiTrackAudio/src
    -I.pio/libdeps/fruitjam/dvhstx/src
    -Iextern/pico-pio-usb
    ; TinyUSB's config: Adafruit's, with a 1024-byte enumeration buffer
    ; (extern/tinyusb-config/tusb_config_fruitjam.h)
    -Iextern/tinyusb-config
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config_fruitjam.h\"
    -DPICO_STANDALONE
    -DPICO_FRUITJAM
    -DA8_HDMI
    ; HDMI mode (src/a8_display.cpp HDMI_MODES): 0 640x480@60, 1 720x400@70,
    ; 2 720x480@60, 3 720x576@50, 4 800x600@60, 5 800x480@60 (default; the
    ; first display tried showed only 1, 3, 5, and 4 sometimes). Serial key V
    ; steps through them.
    ; -DA8_HDMI_MODE=5
    ; sound over HDMI too (serial key O: Fruit Jam codec <-> HDMI, 44100 Hz);
    ; costs 36 KB of RAM (the packet queue). A8_SOUND_HDMI=1: HDMI from start-up.
    -DA8_HDMI_AUDIO
    ; -DA8_SOUND_HDMI=1
    ; the menus' music (the Game Adapter's menu tune, 122 KB of flash)
    -DA8_MENU_MUSIC
    ; the USB-A host ports: a gamepad and / or a keyboard (src/a8_input.cpp)
    -DA8_USB_HOST
    ; the microSD card (src/pico_romfs.cpp): with a card in at start-up the
    ; games come from it (else the flash drive). A8_SD_SPI_MHZ the SPI clock
    ; (or -DA8_SD_SDIO: 4-bit SDIO on the same pins); A8_SD_CACHE_SIZE the
    ; PSRAM a game's files are loaded into (bigger ones are read from the card
    ; as they go; 0: all of them - a device with no PSRAM to spare);
    ; A8_SD_UNZIP_SIZE the PSRAM a zip is unpacked into (0: the flash area).
    -DA8_SD
    -DA8_SD_SPI_MHZ=25
    -DA8_SD_CACHE_SIZE=4194304
    -DA8_SD_UNZIP_SIZE=3670016
    ; -DA8_HEADLESS (instead of A8_HDMI) and optionally
    ; -DA8_AUTOSTART=\"/ATARI/GAME.XEX\"
    ; output: 0 auto (headphones when plugged in, else the speaker), 1 HP, 2 speaker, 3 both
    -DA8_TLV_OUTPUT=0
    ; 22050: as the other boards (fractional PIO divider: BCLK jitter);
    ; 25000 gives an exact divider at 200 MHz (not at HDMI's 240 MHz)
    ; -DA8_SAMPLE_RATE=25000
    -DA8_UNZIP_PHYS=0x1C0000
    -DA8_UNZIP_SIZE=0x20000
    -DA8_SETTINGS_PHYS=0x302000
    -DUSE_TINYUSB
