; Pico2Atari8 - Atari 8-bit computer emulation (atari800) for iCode devices.
;
; [env:quad]  Quad Ultimate CX (GameAdapterRGBPico MODEL_QUAD, RP2350B, 4 MB).
;             Chain-booted by the Quad firmware like Pico2Arcade: the image
;             is linked at 0x10000000 and the boot ROM's rom_chain_image maps
;             its flash slot there, with the Quad's FAT12 "ARCADE ROMS" drive
;             right after it (src/pico_romfs.cpp). Until the Quad firmware
;             gets its own Atari 8-bit slot, it goes into the ARCADE slot
;             (0x360000, 384 KB): Mini-Games > Arcade Games then starts it.
;             `pio run -e quad -t upload` writes only that slot (a8_upload.py).

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2xl
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 200000000L
upload_protocol = picotool
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
lib_ldf_mode = chain+

build_flags =
    -O2
    ; TFT_eSPI: the GMT024 ST7789 panel used by the iCode devices
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DTFT_SPI_MODE=SPI_MODE0
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=8
    -DTFT_RST=9
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=100000000
    -DSPI_PORT=0
    -Isrc
    -Ilib/atari800/src
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-sign-compare
    ; the core's fopen/fclose read from the ROM drive (src/a8_files.cpp)
    -Wl,--wrap=fopen
    -Wl,--wrap=fclose

extra_scripts = pre:tft_overlay.py

[env:quad]
build_flags =
    ${env.build_flags}
    -DPICO_QUAD
    ; ST7789 backlight MOSFET - TFT_eSPI switches it on in init()
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH
    ; Fallbacks if the Quad didn't pass the ROM drive location (scratch[0]/[2]/[3])
    -DPICO_HOST_FAT_WINDOW_OFS=0x60000
    -DPICO_HOST_FAT_PHYS=0x3C0000
    -DPICO_HOST_FAT_SIZE=0x40000
extra_scripts =
    pre:tft_overlay.py
    post:a8_upload.py
custom_slot_offset = 0x10360000
